$kind: http-request
url: "{{URL}}/login"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    username: samadseven07@gmail.com
    password: "11111111"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.access_token) {
          pm.environment.set("TOKEN", jsonData.access_token);
          console.log("Saved JWT TOKEN:", jsonData.access_token);
      }
    language: text/javascript
order: 4000
